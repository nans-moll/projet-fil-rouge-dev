{% extends "base.html" %}
{% block title %}Mot de passe réinitialisé — {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="max-w-md mx-auto px-4 py-12">
    <div class="bg-white rounded-xl p-8 shadow-sm border border-gray-100 text-center">
        <h1 class="text-2xl font-bold text-green-700 mb-3">Mot de passe réinitialisé</h1>
        <p class="text-gray-700 mb-6">Votre mot de passe a été modifié avec succès.</p>
        <a href="{% url 'accounts:login' %}" class="inline-block bg-primary-500 hover:bg-primary-600 text-white font-semibold px-6 py-3 rounded-lg">
            Se connecter
        </a>
    </div>
</div>
{% endblock %}
