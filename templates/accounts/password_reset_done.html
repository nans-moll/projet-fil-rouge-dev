{% extends "base.html" %}
{% block title %}Email envoyé — {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="max-w-md mx-auto px-4 py-12">
    <div class="bg-white rounded-xl p-8 shadow-sm border border-gray-100 text-center">
        <h1 class="text-2xl font-bold text-gray-900 mb-3">Email envoyé</h1>
        <p class="text-gray-700">
            Si l'adresse fournie correspond à un compte, un email avec les
            instructions de réinitialisation vient d'être envoyé.
        </p>
        <a href="{% url 'accounts:login' %}" class="mt-6 inline-block text-primary-500 font-semibold hover:underline">
            Retour à la connexion
        </a>
    </div>
</div>
{% endblock %}
